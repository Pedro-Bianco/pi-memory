[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-memory"
version = "0.1.0"
description = "Memória de longo prazo, base de documentos com busca híbrida e grafo por assunto, com motores plugáveis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pedro-Bianco" }]
keywords = ["memory", "rag", "vector-search", "hybrid-search", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
qdrant = ["qdrant-client>=1.12"]
pdf = ["pypdf>=4.0"]
local = ["fastembed>=0.4", "qdrant-client>=1.12", "pypdf>=4.0"]
chroma = ["chromadb>=0.5"]
mcp = ["mcp>=2.3,<3"]
all = [
    "fastembed>=0.4", "qdrant-client>=1.12", "pypdf>=4.0", "chromadb>=0.5", "mcp>=2.3,<3",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pi-memory = "pi_memory.cli:main"

[project.urls]
Repository = "https://github.com/Pedro-Bianco/pi-memory"
Documentation = "https://github.com/Pedro-Bianco/pi-memory/blob/main/docs/GUIA.md"
Changelog = "https://github.com/Pedro-Bianco/pi-memory/blob/main/CHANGELOG.md"
Issues = "https://github.com/Pedro-Bianco/pi-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_memory"]

# The source package lists what goes in (never "everything not in .gitignore"): local-only
# folders and files must never reach a published package.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "README.md", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md",
                "SECURITY.md", "CONTRIBUTING.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_engines and not browser'"
markers = [
    "real_engines: needs real models (Ollama, FastEmbed) and runs slowly",
    "browser: needs Playwright and Chrome (admin page click-through)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]   # notebooks are generated by examples/notebooks/_build.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# notebook cells are written as strings and must stay readable in the notebook
"examples/notebooks/_build.py" = ["E501"]
